[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmdl"
version = "0.1.0"
description = "Pinned Qwen3-VL MMMU validation evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1",
  "accelerate==1.11.0", "datasets==4.3.0", "huggingface-hub==0.36.0",
  "peft==0.17.1",
  "Pillow==11.3.0", "numpy==2.3.4", "PyYAML==6.0.3", "psutil==7.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
